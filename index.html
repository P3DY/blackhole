<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="You are a black hole adrift among galaxies. Capture stars to grow, swallow galaxy cores and rival black holes." />
    <title>Black Hole</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffb070'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23020207'/%3E%3C/svg%3E"
    />
    <!-- Inline, so the loading screen shows before the script (and style.css with it) has arrived. -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #05060a;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: #b8c0d0;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.08em;
        transition: opacity 0.6s ease;
      }
      .loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .loading-hole {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #020207;
        box-shadow:
          0 0 0 2px #ffb070,
          0 0 18px 4px rgba(255, 176, 112, 0.45);
        animation: loading-pulse 1.6s ease-in-out infinite;
      }
      @keyframes loading-pulse {
        50% {
          box-shadow:
            0 0 0 2px #ffd9b0,
            0 0 28px 8px rgba(255, 176, 112, 0.6);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-hole {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="loading" role="status">
      <div class="loading-hole"></div>
      <div>Gathering stars…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
