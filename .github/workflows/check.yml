# Lints, tests and builds every pull request (and every push to main), then plays the game headless for a while,
# so a broken build or a page error shows up before it's deployed.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run smoke
